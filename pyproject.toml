[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-magnify"
version = "0.1.0"
description = "A macOS-style magnifying dock for KDE Plasma, Hyprland, Sway, XFCE and other Linux desktops"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# PyGObject / pycairo are normally installed from the distro (see README).
dependencies = []

[project.optional-dependencies]
x11 = ["python-xlib"]

[project.scripts]
linux-magnify = "linux_magnify.__main__:main"

[tool.setuptools]
packages = ["linux_magnify"]
