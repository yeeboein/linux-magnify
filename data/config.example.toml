# ~/.config/linux-magnify/config.toml
# The dock reloads this file automatically when you save it.

[dock]
position = "bottom"       # bottom | top | left | right
icon_size = 48            # resting icon size (px)
magnification = 2.0       # size of the icon under the cursor, relative to resting (1.0 = off, max 4.0)
spread = 3.0              # how many neighbouring icons on each side are affected
spacing = 8               # gap between icons (px)
padding = 8               # space between icons and the shelf edge (px)
margin = 8                # gap between the shelf and the screen edge (px)
hide_mode = "auto"        # auto (same as the original panel) | never | dodge (hide when a window covers it) | always
autohide_delay_ms = 400   # wait this long after the pointer leaves before hiding
show_labels = true        # show the app name above the hovered icon
show_running = true       # also show open apps that are not pinned
animation_ms = 90         # smoothing time constant; lower = snappier
monitor = 0               # monitor index
layer = "top"             # Wayland layer: background | bottom | top | overlay
backend = "auto"          # auto | wayland | x11
hide_panels = "all"       # hide the original panels while linux-magnify is enabled: all (only magdoc) | dock (same edge + other docks) | none

[style]
background = "rgba(28, 28, 32, 0.55)"
border = "rgba(255, 255, 255, 0.18)"
corner_radius = 18
indicator = "rgba(255, 255, 255, 0.9)"
label_background = "rgba(20, 20, 24, 0.85)"
label_foreground = "rgba(255, 255, 255, 1.0)"

[home]
enabled = true            # home button: first icon on the dock, opens your app menu
icon = "auto"             # auto = copy the launcher icon from your original panel, or an icon name / file path
command = "auto"          # auto = your desktop's own app menu, or a command such as "rofi -show drun"

[updates]
notify = true             # notify when a new linux-magnify version is on GitHub (with an "Update now" button)
branch = "main"

[apps]
# Leave "pinned" unset to copy the pinned apps from your original panel/dock (kept in sync).
# Set it to use your own list: desktop-file ids (filename without .desktop, see
# /usr/share/applications), or custom launchers as inline tables.
